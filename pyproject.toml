[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coursera-bypass"
version = "1.0.0"
description = "Skip mandatory Coursera courses in seconds"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "loguru>=0.7",
    "pydantic>=2.0",
    "requests>=2.28",
    "browser-cookie3>=0.19",
    "google-genai",
]

[project.scripts]
coursera-bypass = "coursera_bypass.main:main"
skipera = "coursera_bypass.main:main"

[project.urls]
Homepage = "https://github.com/Ashshar6055/Coursera-Bypass"
Issues = "https://github.com/Ashshar6055/Coursera-Bypass/issues"

[tool.setuptools.packages.find]
include = ["coursera_bypass*"]
